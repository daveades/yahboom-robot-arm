# Chess board model in the robot base frame — the single source of truth
# read by tools/hover_test.py, tools/chess_game.py, tools/reach_check.py
# (CLI flags override). Re-measure whenever the board or the robot moves.
a1: [0.130, 0.100]   # center of square a1, meters (x forward, y left)
                     # y measured 2026-07-17: board sits 1 cm left of nominal
square: 0.026        # square size, meters — ruler-check the print! If a
                     # printed square isn't 26 mm, put the measured size here.
yaw_deg: -90.0       # file direction a->h: 0 = +x (away), 90 = +y (left)
mirror: false        # flip rank direction if hovers land mirrored
offsets:             # measured with tools/place_test.py 2026-07-18:
                     # meters ADDED to the commanded square center so the
                     # claw lands centered; interpolated between anchors.
                     # Zero anchors mark squares verified as centered.
                     # NOTE anchors depend on the claw pitch they were
                     # measured at - re-verify after changing --pick-tilt.
  a2: [0.0, 0.0]
  d3: [-0.004, 0.0]      # hardware-verified at 32deg pitch (2026-07-18)
  e3: [-0.004, 0.0]      # hardware-verified at 32deg pitch
  # Right wing: the pitch bump (26deg -> 26.5/28/30.5) moved the claw
  # outward ~1mm per degree (rate measured at d3). These extend the
  # measured g2 anchor by that model - PROVISIONAL, verify with
  # tools/place_test.py f2 g2 h2 and replace with measured values.
  f2: [-0.0065, -0.0045]
  g2: [-0.009, -0.005]   # measured (-6,-6) at 26deg + modeled pitch shift
  h2: [-0.011, -0.003]
