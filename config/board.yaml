# Chess board model in the robot base frame — the single source of truth
# read by tools/hover_test.py, tools/chess_game.py, tools/reach_check.py
# (CLI flags override). Re-measure whenever the board or the robot moves.
#
# Calibration reset 2026-07-18 (full, from scratch). Re-verify a1 by
# hover, then rebuild the per-square offsets with tools/place_test.py.
# Pitch is now chosen from each square's NOMINAL center, so an offset
# anchor no longer drags the pitch - anchors are directly calibratable.
a1: [0.140, 0.091]   # center of square a1, meters (x forward, y left)
                     # PHYSICALLY MEASURED 2026-07-18: 14.0 cm forward,
                     # 9.1 cm left of the base rotation axis. The 9.1 =
                     # 3.5 squares x 2.6 cm confirms the board is centered
                     # on the robot's forward axis (d/e boundary).
square: 0.026        # square size, meters — ruler-check the print! If a
                     # printed square isn't 26 mm, put the measured size here.
yaw_deg: -90.0       # file direction a->h: 0 = +x (away), 90 = +y (left)
mirror: false        # flip rank direction if hovers land mirrored

# offsets:           # square -> [dx, dy] meters ADDED to the commanded
#   e4: [0.0, 0.0]   # center so the claw lands centered; inverse-distance
#                    # interpolated between anchors. Rebuild by measuring
#                    # with tools/place_test.py. (empty = no correction)

# pitch:             # square -> claw pitch (deg) to pin a square whose
#   g2: 28           # pitch still slides even after the nominal-center
#                    # fix. Try without pins first; add only if needed.
